name: "ZenithFlow Unified CI & Security Scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1' # Run automatically every Monday at midnight
  workflow_dispatch: # Enable manual scanning triggers in GitHub UI

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # 1. Continuous Integration & Dependency Auditing
  ci_build:
    name: Build, Test & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: TypeScript Validation
        run: npx tsc --noEmit

      - name: Build Next.js Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

  # 2. SAST (Static Application Security Testing) via GitHub CodeQL
  sast_codeql:
    name: CodeQL Code Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL Engine
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'

      - name: Run CodeQL Scanner
        uses: github/codeql-action/analyze@v3

  # 3. DAST (Dynamic Application Security Testing) via OWASP ZAP
  dast_zap:
    name: OWASP ZAP Web Scan (DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scanner
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://zenithflow.dev/'
          fail_action: false # Generates detailed HTML alerts report in your action summary
          allow_issue_writing: false
          token: ""
